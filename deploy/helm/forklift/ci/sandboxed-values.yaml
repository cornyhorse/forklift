# Sensitive data from untrusted sources: workers under gVisor, one job per process, the engine
# without network inside the sandbox.
postgres:
  host: postgres.databases.svc.cluster.local
  existingSecret: forklift-db
objectStore:
  endpoint: https://s3.example.org
  existingSecret: forklift-s3
workers:
  - name: interactive
    lanes: [interactive]
    replicas: 2
  - name: sandboxed
    lanes: [batch]
    replicas: 4
    isolation: sandboxed
    sandboxedEngine: no-network
    runtimeClassName: gvisor
    landlock: auto
networkPolicies:
  postgres:
    to: [{ipBlock: {cidr: 10.0.12.0/24}}]
  storeEgress:
    mode: cidr
    cidrs: [203.0.113.0/24]

name: Auto-Format and Test

on:
  push:
    branches: [ main, develop, "feature/*", "feat/*", "bugfix/*", "hotfix/*", 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  format-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov black isort flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f pyproject.toml ]; then pip install -e .; fi

    - name: Auto-format code with Black
      run: |
        black src/ tests/

    - name: Auto-sort imports with isort
      run: |
        isort src/ tests/

    - name: Check for formatting changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push formatting changes
      if: steps.verify-changed-files.outputs.changed == 'true' && github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git commit -m "🤖 Auto-format code with Black and isort"
        git push

    - name: Lint with flake8 (after formatting)
      run: |
        flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203,W503

    - name: Run full test suite with coverage
      run: |
        python -m pytest tests/ --cov=src/forklift/ --cov-report=term-missing --cov-report=html -v

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: htmlcov/

    - name: Check coverage threshold
      run: |
        COVERAGE=$(python -m coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//')
        echo "Current coverage: $COVERAGE%"
        if [ $COVERAGE -lt 95 ]; then
          echo "::warning::Coverage ($COVERAGE%) is below 95% threshold"
        else
          echo "::notice::Excellent coverage: $COVERAGE%"
        fi

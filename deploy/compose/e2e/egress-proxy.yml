# For the egress-proxy profile's end-to-end test (test_egress_proxy.py), on top of
# external-store.yml: the "external" object store is a second RustFS on the public network only,
# so the workers' internal network has no route to it and they reach it through the egress
# proxy. Its port is published for the test client's presigned uploads and downloads. Paths are
# relative to deploy/compose (the directory of the first file).
#
#   python deploy/compose/generate_env.py --store-url http://store-external:9000 \
#     --public-store-url http://localhost:48290 > deploy/compose/.env
#   # fill in FORKLIFT_STORE_ACCESS_KEY and FORKLIFT_STORE_SECRET_KEY (any values: they become
#   # the external RustFS's root credentials)
#   docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/external-store.yml \
#     -f deploy/compose/e2e/egress-proxy.yml up -d --build --wait
#
# test_egress_proxy.py says how to run the tests.
services:
  store-external:
    image: ${FORKLIFT_RUSTFS_IMAGE:-rustfs/rustfs:1.0.1}
    environment:
      RUSTFS_ACCESS_KEY: ${FORKLIFT_STORE_ACCESS_KEY:?set it in .env}
      RUSTFS_SECRET_KEY: ${FORKLIFT_STORE_SECRET_KEY:?set it in .env}
    ports: ["127.0.0.1:${FORKLIFT_E2E_EXTERNAL_STORE_PORT:-48290}:9000"]
    networks: [public]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  init:
    depends_on:
      store-external: {condition: service_healthy}

  # An https:// destination the proxy also allows, for a tunnel (CONNECT) that must work: Caddy
  # answering "ok" with a certificate of its own CA
  tls-stand-in:
    image: ${FORKLIFT_CADDY_IMAGE:-caddy:2.11.7}
    command:
      - sh
      - -c
      - printf 'tls-stand-in {\n\ttls internal\n\trespond "ok"\n}\n' > /tmp/Caddyfile
        && exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    networks: [public]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2019/config/"]
      interval: 2s
      timeout: 5s
      retries: 30

  egress-proxy:
    environment:
      FORKLIFT_EGRESS_PROXY_ALLOW: ${FORKLIFT_STORE_URL} https://tls-stand-in
    depends_on:
      tls-stand-in: {condition: service_healthy}

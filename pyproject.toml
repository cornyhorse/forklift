[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forklift"
version = "0.1.0"
description = "Data processing pipeline with PyArrow"
authors = [{name = "Forklift Team"}]
dependencies = [
    "pyarrow>=10.0.0",
    "pandas>=1.5.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage[toml]>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src/forklift",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-config=pyproject.toml",
    "--strict-markers",
    "--disable-warnings"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "s3: marks tests as requiring S3 access",
    "mock: marks tests as using mocks",
    "unit: marks tests as unit tests",
    "excel: marks tests as Excel-related",
    "fwf: marks tests as fixed-width file related",
    "csv: marks tests as CSV-related",
    "sql: marks tests as SQL-related"
]

[tool.coverage.run]
source = ["src/forklift"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/venv/*",
    "*/.venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

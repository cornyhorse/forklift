{% load forklift_ui %}
{% if page.paginator.num_pages > 1 %}
  <nav class="actions" aria-label="Pages">
    {% if page.has_previous %}
      <a class="button secondary small" href="{% query page=page.previous_page_number %}">Previous</a>
    {% endif %}
    <span>Page {{ page.number }} of {{ page.paginator.num_pages }} ({{ page.paginator.count }} in all)</span>
    {% if page.has_next %}
      <a class="button secondary small" href="{% query page=page.next_page_number %}">Next</a>
    {% endif %}
  </nav>
{% endif %}

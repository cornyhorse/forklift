# The least a production install needs: an external PostgreSQL and store, both from Secrets, and
# where they are for the NetworkPolicies (the store by CIDR).
postgres:
  host: postgres.databases.svc.cluster.local
  existingSecret: forklift-db
objectStore:
  endpoint: https://s3.example.org
  existingSecret: forklift-s3
networkPolicies:
  postgres:
    to:
      - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: databases}}
        podSelector: {matchLabels: {app.kubernetes.io/name: postgresql}}
  storeEgress:
    mode: cidr
    cidrs: [203.0.113.0/24]

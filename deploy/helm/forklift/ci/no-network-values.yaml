# Untrusted files from outside: an interactive group and a batch group with the no-network
# profile (a Localhost seccomp profile that allows unshare); inputs above 1 GiB are refused.
postgres:
  host: postgres.databases.svc.cluster.local
  existingSecret: forklift-db
objectStore:
  endpoint: https://s3.example.org
  existingSecret: forklift-s3
workerDefaults:
  isolation: no-network
  stageMaxBytes: 1GiB
workers:
  - name: interactive
    lanes: [interactive]
  - name: batch
    lanes: [batch]
    seccompProfile: {localhostProfile: profiles/forklift-no-network.json}
networkPolicies:
  postgres:
    to: [{ipBlock: {cidr: 10.0.12.0/24}}]
  storeEgress:
    mode: cidr
    cidrs: [203.0.113.0/24]

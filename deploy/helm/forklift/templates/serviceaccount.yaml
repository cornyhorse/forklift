{{- if .Values.serviceAccount.create }}
# No forklift process talks to the Kubernetes API: no Role, and no token mounted (every pod sets
# automountServiceAccountToken: false as well).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "forklift.serviceAccountName" . }}
  labels:
    {{- include "forklift.labels" (dict "root" . "component" "gateway") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
# The bootstrap Jobs' account: a hook, so that it exists before the pre-install Job (it stays
# for the post-install one).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "forklift.serviceAccountName" . }}-bootstrap
  labels:
    {{- include "forklift.labels" (dict "root" . "component" "bootstrap") | nindent 4 }}
  annotations:
    {{- include "forklift.hookAnnotations" (dict "hooks" "pre-install,pre-upgrade" "weight" -30) | nindent 4 }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}

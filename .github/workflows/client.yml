# forklift-client (clients/python): formatting and lint, the models' check against
# contracts/openapi.json, the unit tests with 100% line and branch coverage on every supported
# Python, the package build, and the Airflow provider's tests (dag.test() runs of the operator,
# sensor and trigger) against the oldest and the newest Airflow it supports.
name: Client

on:
  push:
    branches: [ main, develop, "feature/*", "feat/*", "bugfix/*", "hotfix/*" ]
    paths:
      - "clients/python/**"
      - "contracts/openapi.json"
      - ".github/workflows/client.yml"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "clients/python/**"
      - "contracts/openapi.json"
      - ".github/workflows/client.yml"

# Least privilege: the tests never need to write to the repository.
permissions:
  contents: read

concurrency:
  group: client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        pip install "black>=23.12" "isort>=5.13" "flake8>=6.0"

    - name: Check formatting and lint
      run: |
        black --check --diff --line-length 99 clients/python
        isort --check-only --diff --profile black --line-length 99 clients/python
        flake8 --max-line-length=99 --extend-ignore=E203,W503 clients/python

    # The models are generated from the OpenAPI document; a change of the API that the client
    # does not follow fails here (and in the contract tests).
    - name: The models match contracts/openapi.json
      run: python clients/python/tools/generate_models.py --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the client and its test tools
      run: |
        python -m pip install --upgrade pip
        pip install -e "clients/python[dev]"

    # A fake gateway and object store on a real local HTTP server (and an https one with a
    # self-signed certificate): every request and answer is checked against the OpenAPI document.
    - name: Unit and contract tests (every line and branch of forklift_client)
      working-directory: clients/python
      run: python -m pytest tests/unit -v --cov=forklift_client --cov-branch --cov-report=term-missing --cov-fail-under=100

    - name: Build the package and check its metadata
      if: matrix.python-version == '3.12'
      run: |
        pip install build twine
        python -m build clients/python --outdir dist/
        twine check dist/*

    - name: The wheel installs and imports without anything else
      if: matrix.python-version == '3.12'
      working-directory: ${{ runner.temp }}
      run: |
        python -m venv clean
        clean/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
        clean/bin/python -c "import forklift_client, forklift_client.airflow.provider as p; print(forklift_client.__version__, p.get_provider_info()['package-name'])"

  airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - airflow: '3.2.2'     # the oldest release the extra allows (apache-airflow>=3.2)
            python-version: '3.10'
          - airflow: '3.3.2'
            python-version: '3.13'

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # Airflow is installed with its own constraints, as Airflow's documentation asks
    - name: Install Airflow ${{ matrix.airflow }} and the client
      env:
        CONSTRAINTS: https://raw.githubusercontent.com/apache/airflow/constraints-${{ matrix.airflow }}/constraints-${{ matrix.python-version }}.txt
      run: |
        python -m pip install --upgrade pip
        pip install "apache-airflow==${{ matrix.airflow }}" pytest pytest-cov jsonschema --constraint "$CONSTRAINTS"
        pip install --no-deps -e clients/python

    - name: Airflow tests (every line and branch of forklift_client.airflow)
      working-directory: clients/python
      run: python -m pytest tests/with_airflow -v --cov --cov-config=tests/with_airflow/coverage.ini --cov-report=term-missing

name: Auto-Format and Test

on:
  push:
    branches: [ main, develop, "feature/*", "feat/*", "bugfix/*", "hotfix/*", 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    container: ghcr.io/cornyhorse/forklift:ci
    permissions:
      contents: write
      pull-requests: write
      packages: read

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Auto-format code with Black
      run: |
        black --line-length 99 src/ tests/

    - name: Auto-sort imports with isort
      run: |
        isort --line-length 99 src/ tests/

    - name: Check for formatting changes and commit
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: '🤖 Auto-format code with Black and isort'
        file_pattern: 'src/ tests/'
        commit_user_name: 'github-actions[bot]'
        commit_user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
        skip_dirty_check: false
        skip_fetch: false
        skip_checkout: false
        disable_globbing: false

    - name: Lint with flake8 (src only, excluding tests)
      run: |
        flake8 src/ --max-line-length=99 --extend-ignore=E203,W503

    - name: Install package in development mode
      run: |
        pip install --user -e .[all]

    - name: Run full test suite with coverage
      run: |
        python -m pytest tests/ --cov=src/forklift/ --cov-report=term-missing --cov-report=html -v

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: htmlcov/

    - name: Check coverage threshold
      run: |
        COVERAGE=$(python -m coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//')
        echo "Current coverage: $COVERAGE%"
        if [ $COVERAGE -lt 95 ]; then
          echo "::warning::Coverage ($COVERAGE%) is below 95% threshold"
        else
          echo "::notice::Excellent coverage: $COVERAGE%"
        fi

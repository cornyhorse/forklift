<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forklift</title>
</head>
<body>
  <main>
    <h1>Forklift</h1>
    <p>Signed in as {{ request.user.username }} ({{ request.user.get_role_display }}).</p>
    <p>The API is at <a href="/api/v1/docs">/api/v1</a>.</p>
    <form method="post" action="{% url 'forklift-logout' %}">
      {% csrf_token %}
      <button type="submit">Sign out</button>
    </form>
    <p><small>forklift-web {{ version }}</small></p>
  </main>
</body>
</html>

# Canonical test workflow: the full test suite on every supported Python version, with coverage.
# Formatting/lint checks (and the auto-format of feature branches) live in fast-test.yml.
name: Test Suite

on:
  push:
    branches: [ main, develop, "feature/*", "feat/*", "bugfix/*", "hotfix/*" ]
  pull_request:
    branches: [ main, develop ]

# Least privilege: the tests never need to write to the repository.
permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system libraries (unixODBC runtime for pyodbc)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends unixodbc

    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-py${{ matrix.python-version }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all,dev]"

    # Every line and branch of src/forklift is covered; the run fails if that slips. The service
    # tests (tests/integration-tests/services) skip here and run in the services job below.
    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --cov=src/forklift/ --cov-report=xml --cov-report=term-missing --cov-report=html --cov-fail-under=100 -v

    - name: Upload coverage report
      if: always() && matrix.python-version == '3.12'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: htmlcov/

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  # The declared lower bound of pyarrow must keep working (numpy<2 and pandas<2.3 are what that
  # pyarrow release was built against).
  minimum-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install system libraries (unixODBC runtime for pyodbc)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends unixodbc

    - name: Install dependencies at their minimum supported versions
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all,dev]" "pyarrow==16.1.0" "numpy<2" "pandas<2.3"

    - name: Run unit tests
      run: python -m pytest tests/unit-tests -v

  # The core install (no extras) must import: pandas, polars, openpyxl, pyodbc ... are optional,
  # so nothing outside the declared runtime dependencies may be imported at import time.
  core-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install the package without extras
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Import the package from outside the source tree
      working-directory: ${{ runner.temp }}
      run: |
        python -c "import forklift; print(f'Forklift version: {forklift.__version__}')"
        python -c "from forklift import generate_schema_from_csv, import_csv, read_csv, run_job"
        python -c "import forklift.jobs, forklift.outputs.sql"

  # Integration tests against real services: RustFS (S3-compatible object store), PostgreSQL,
  # MySQL, SQL Server and Oracle Database Free, started from the compose file developers use
  # (scripts/test-services.sh). The tests run as logins and with credentials that have only the
  # privileges each test grants them. The SQL Server and Oracle images are large: the repository
  # variables FORKLIFT_TEST_MSSQL_IMAGE / FORKLIFT_TEST_ORACLE_IMAGE can point at copies in another
  # registry (FORKLIFT_TEST_IMAGE_REGISTRY with its user and token secrets logs in to it).
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FORKLIFT_TEST_MSSQL_IMAGE: ${{ vars.FORKLIFT_TEST_MSSQL_IMAGE }}
      FORKLIFT_TEST_ORACLE_IMAGE: ${{ vars.FORKLIFT_TEST_ORACLE_IMAGE }}

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install ODBC drivers (PostgreSQL, MariaDB for MySQL, SQL Server, Oracle)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends unixodbc odbc-postgresql odbc-mariadb curl gnupg unzip libaio1t64
        curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft-prod.gpg
        curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/microsoft-prod.list > /dev/null
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18
        for part in basiclite odbc; do
          curl -fsSL -o "/tmp/instantclient-$part.zip" "https://download.oracle.com/otn_software/linux/instantclient/instantclient-$part-linuxx64.zip"
          sudo unzip -q -o "/tmp/instantclient-$part.zip" -d /opt/oracle
        done
        IC=$(ls -d /opt/oracle/instantclient_* | sort -V | tail -1)
        # Ubuntu 24.04 renamed libaio.so.1; Instant Client links the old name
        sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
        echo "$IC" | sudo tee /etc/ld.so.conf.d/oracle-instantclient.conf > /dev/null
        sudo ldconfig
        printf '[Oracle %s ODBC driver]\nDescription = Oracle Instant Client ODBC driver\nDriver = %s\n' \
          "$(basename "$IC" | cut -d_ -f2)" "$(ls "$IC"/libsqora.so.* | head -1)" > /tmp/oracle-odbc.ini
        sudo odbcinst -i -d -f /tmp/oracle-odbc.ini
        odbcinst -q -d

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all,dev]"

    - name: Log in to the image cache
      if: vars.FORKLIFT_TEST_IMAGE_REGISTRY != ''
      uses: docker/login-action@v4
      with:
        registry: ${{ vars.FORKLIFT_TEST_IMAGE_REGISTRY }}
        username: ${{ secrets.FORKLIFT_TEST_IMAGE_REGISTRY_USER }}
        password: ${{ secrets.FORKLIFT_TEST_IMAGE_REGISTRY_TOKEN }}

    - name: Start RustFS, PostgreSQL, MySQL, SQL Server and Oracle
      run: docker compose -f tests/integration-tests/services/compose.yaml up -d --wait

    # FORKLIFT_TEST_SERVICES=1 makes an unreachable service fail the tests instead of skipping them
    - name: Run the service tests
      env:
        FORKLIFT_TEST_SERVICES: "1"
      run: python -m pytest tests/integration-tests/services --no-cov -v

    - name: Show service logs
      if: failure()
      run: docker compose -f tests/integration-tests/services/compose.yaml logs

  # forklift-web, the gateway: its own package, Python and coverage gate. Role matrices over every
  # endpoint and every page, queue concurrency, trust boundary (no engine, no pyarrow), the real
  # two-port gunicorn, browser tests, and the check that contracts/openapi.json is current.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    defaults:
      run:
        working-directory: services/web

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install forklift-web and its test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]" "black>=23.12" "isort>=5.13" "flake8>=6.0"

    # The UI's browser tests (sign in, uploads through real presigned PUTs, admin flows)
    - name: Install Chromium for Playwright
      run: python -m playwright install --with-deps chromium

    - name: Check formatting and lint
      run: |
        black --check --diff --line-length 99 src tests
        isort --check-only --diff --profile black --line-length 99 src tests
        flake8 src tests

    - name: Start RustFS and PostgreSQL
      working-directory: .
      run: docker compose -f tests/integration-tests/services/compose.yaml up -d --wait rustfs postgres

    - name: Create the tests' database login
      working-directory: .
      run: >-
        docker compose -f tests/integration-tests/services/compose.yaml exec -T postgres
        psql -U forklift_admin -d forklift_test
        -c "CREATE ROLE forklift_web_test LOGIN PASSWORD 'forklift-web-test-secret' CREATEDB"

    - name: Run the tests
      run: python -m pytest -v --cov=forklift_web --cov-branch --cov-report=term-missing --cov-fail-under=100

    - name: Build the image
      if: matrix.python-version == '3.13'
      working-directory: .
      run: docker build -f services/web/Dockerfile -t forklift-web:ci .

    - name: Show service logs
      if: failure()
      working-directory: .
      run: docker compose -f tests/integration-tests/services/compose.yaml logs rustfs postgres

  # forklift-worker, the supervisor: unit tests (100% coverage), integration tests with the real
  # engine (Landlock, the no-network profile, RustFS presigned URLs, a SQL-lane job against
  # PostgreSQL), and the image.
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install ODBC drivers (PostgreSQL, MariaDB for MySQL)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends unixodbc odbc-postgresql odbc-mariadb

    # The no-network profile runs the engine in an unprivileged user and network namespace
    - name: Allow unprivileged user namespaces
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Install the engine and the worker
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[excel,sql]" -e "services/worker[dev]"

    - name: Check formatting and lint
      run: |
        black --check --line-length 99 services/worker
        isort --check-only --profile black --line-length 99 services/worker
        flake8 --max-line-length=99 --extend-ignore=E203,W503 services/worker

    - name: Unit tests (every line and branch of forklift_worker)
      working-directory: services/worker
      run: python -m pytest tests/unit -v --cov=forklift_worker --cov-branch --cov-report=term-missing --cov-fail-under=100

    - name: Start RustFS and PostgreSQL
      run: docker compose -f tests/integration-tests/services/compose.yaml up -d --wait rustfs postgres

    - name: Integration tests (real engine, RustFS presigned URLs, SQL lane)
      working-directory: services/worker
      env:
        FORKLIFT_TEST_SERVICES: "1"
      run: python -m pytest tests/integration -v

    - name: Build the image
      if: matrix.python-version == '3.13'
      run: docker build -f services/worker/Dockerfile -t forklift-worker:ci .

    - name: Show service logs
      if: failure()
      run: docker compose -f tests/integration-tests/services/compose.yaml logs

  # The whole platform from deploy/compose (gateway, worker, PostgreSQL, RustFS), built from this
  # checkout and used from outside like a person or a pipeline would: sign in, upload through a
  # presigned URL, run on the worker, download the Parquet; schema generation, a threshold
  # failure keeping bad_rows, a streamed input, a viewer's limits.
  platform-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install the test client's dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pyarrow

    - name: Generate the stack's secrets
      run: python deploy/compose/generate_env.py > deploy/compose/.env

    - name: Build and start the stack
      run: docker compose -f deploy/compose/docker-compose.yml up -d --build --wait

    - name: Run the end-to-end tests
      env:
        FORKLIFT_E2E_ENV_FILE: deploy/compose/.env
      run: python -m pytest deploy/compose/e2e -v -p no:cacheprovider -o addopts=

    - name: Show the stack's logs
      if: failure()
      run: docker compose -f deploy/compose/docker-compose.yml logs

    - name: Stop the stack
      if: always()
      run: docker compose -f deploy/compose/docker-compose.yml down -v

{{- if .Values.mcp.enabled }}
{{- /*
The remote MCP proxy (image forklift-mcp): Streamable HTTP at /mcp, a client of the gateway's
public API with each caller's own token. It stores nothing and holds no credentials of its own.
*/ -}}
{{- $fullname := include "forklift.fullname" . -}}
{{- $m := .Values.mcp -}}
{{- $labels := dict "root" . "component" "mcp" -}}
{{- $hosts := list (printf "%s-mcp" $fullname) (printf "%s-mcp.%s.svc" $fullname .Release.Namespace) -}}
{{- if .Values.gateway.ingress.enabled }}{{- $hosts = prepend $hosts .Values.gateway.ingress.host -}}{{- end }}
{{- $hosts = uniq (concat $hosts $m.allowedHosts) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-mcp
  labels:
    {{- include "forklift.labels" $labels | nindent 4 }}
spec:
  replicas: {{ $m.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "forklift.selectorLabels" $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "forklift.labels" $labels | nindent 8 }}
      {{- with $m.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "forklift.serviceAccountName" . }}
      automountServiceAccountToken: false
      # Without this, Kubernetes would set FORKLIFT_MCP_PORT=tcp://... for a Service named
      # <release>-forklift-mcp, which is also the proxy's own port setting.
      enableServiceLinks: false
      {{- include "forklift.imagePullSecrets" . | nindent 6 }}
      {{- include "forklift.podSecurityContext" (dict) | nindent 6 }}
      containers:
        - name: mcp
          image: {{ include "forklift.image" (dict "root" . "image" .Values.image.mcp) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8000, protocol: TCP}
          env:
            - {name: FORKLIFT_MCP_PORT, value: "8000"}
            - {name: FORKLIFT_MCP_API_URL, value: "http://{{ include "forklift.gatewayService" . }}:{{ .Values.gateway.service.port }}"}
            - {name: FORKLIFT_MCP_ALLOWED_HOSTS, value: {{ join "," $hosts | quote }}}
            - {name: FORKLIFT_MCP_LOG_LEVEL, value: {{ $m.logLevel | quote }}}
            {{- if $m.caBundle.configMap }}
            - {name: FORKLIFT_MCP_CA_FILE, value: /etc/forklift/ca/ca.crt}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: http, httpHeaders: [{name: Host, value: {{ printf "%s-mcp" $fullname }}}]}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http, httpHeaders: [{name: Host, value: {{ printf "%s-mcp" $fullname }}}]}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          {{- include "forklift.containerSecurityContext" . | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if $m.caBundle.configMap }}
            - {name: ca, mountPath: /etc/forklift/ca, readOnly: true}
            {{- end }}
      volumes:
        {{- include "forklift.tmpVolume" . | nindent 8 }}
        {{- with $m.caBundle.configMap }}
        - name: ca
          configMap:
            name: {{ . }}
            items: [{key: {{ $m.caBundle.key }}, path: ca.crt}]
        {{- end }}
      {{- with $m.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-mcp
  labels:
    {{- include "forklift.labels" $labels | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "forklift.selectorLabels" $labels | nindent 4 }}
  ports:
    - {name: http, port: 8000, targetPort: http, protocol: TCP}
{{- if gt (int $m.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-mcp
  labels:
    {{- include "forklift.labels" $labels | nindent 4 }}
spec:
  maxUnavailable: {{ $m.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "forklift.selectorLabels" $labels | nindent 6 }}
{{- end }}
{{- end }}

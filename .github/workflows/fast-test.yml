name: Auto-Format and Test

on:
  push:
    branches: [ main, develop, "feature/*", "feat/*", "bugfix/*", "hotfix/*", 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov black isort flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f pyproject.toml ]; then pip install -e .[all]; fi

    - name: Auto-format code with Black
      run: |
        black --line-length 99 src/ tests/

    - name: Auto-sort imports with isort
      run: |
        isort --line-length 99 src/ tests/

    - name: Check for formatting changes and commit
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: '🤖 Auto-format code with Black and isort'
        file_pattern: 'src/ tests/'
        commit_user_name: 'github-actions[bot]'
        commit_user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
        skip_dirty_check: false
        skip_fetch: false
        skip_checkout: false
        disable_globbing: false

    - name: Lint with flake8 (src only, excluding tests)
      run: |
        flake8 src/ --max-line-length=99 --extend-ignore=E203,W503

    - name: Run full test suite with coverage
      run: |
        python -m pytest tests/ --cov=src/forklift/ --cov-report=term-missing --cov-report=html -v

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: htmlcov/

    - name: Check coverage threshold
      run: |
        COVERAGE=$(python -m coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//')
        echo "Current coverage: $COVERAGE%"
        if [ $COVERAGE -lt 95 ]; then
          echo "::warning::Coverage ($COVERAGE%) is below 95% threshold"
        else
          echo "::notice::Excellent coverage: $COVERAGE%"
        fi

  s3-integration:
    runs-on: ubuntu-latest
    # Only run if S3 credentials are available (not on forks)
    if: github.repository == 'cornyhorse/forklift' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-s3-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-s3-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f pyproject.toml ]; then pip install -e .[all]; fi

    - name: Run S3 streaming tests (no mock)
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_TEST_BUCKET: ${{ secrets.S3_TEST_BUCKET }}
        S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        FORKLIFT_CI_MODE: "true"
      run: |
        python -m pytest tests/unit-tests/test_s3_streaming.py --no-s3-mock -v --tb=short

    - name: Run integration tests with real S3
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_TEST_BUCKET: ${{ secrets.S3_TEST_BUCKET }}
        S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        FORKLIFT_CI_MODE: "true"
      run: |
        python -m pytest tests/ --integration --no-s3-mock -v --tb=short -k "s3"

    - name: Upload S3 test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: s3-test-results-py3.12
        path: |
          *.xml
          htmlcov/

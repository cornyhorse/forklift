[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forklift-mcp-server"
version = "0.1.0"
description = "Forklift's remote MCP server: the MCP tools over Streamable HTTP, as a client of the gateway's /api/v1 with each caller's own API token"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Matt", email = "matt@mattkingsbury.com"}]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# No database, no storage credentials: the proxy calls the gateway's public API with the caller's
# token (forklift-client, from clients/python of this repository) and reads bad rows with HTTP
# range requests of the presigned URLs the gateway hands out (pyarrow). The image pins exact
# versions with constraints.txt.
dependencies = [
    "forklift-client>=0.1,<0.2",
    "mcp>=2.3,<3",
    "pyarrow>=16",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=6.0.0",
]

[project.scripts]
forklift-mcp-server = "forklift_mcp_server:main"

[project.urls]
Repository = "https://github.com/cornyhorse/forklift"
Documentation = "https://github.com/cornyhorse/forklift/blob/main/docs/platform/mcp.md"

[tool.hatch.build.targets.wheel]
packages = ["src/forklift_mcp_server"]

# The schema documentation pages (resources forklift://docs/schemas/<file>.md) travel inside the
# wheel; a checkout serves docs/schemas of the repository instead (forklift_mcp_server.docs).
[tool.hatch.build.targets.wheel.force-include]
"../../docs/schemas" = "forklift_mcp_server/docs/schemas"

[tool.black]
line-length = 99
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 99
# The project directory is called "mcp", which isort would otherwise take for the SDK's package
known_third_party = ["mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["forklift_mcp_server"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

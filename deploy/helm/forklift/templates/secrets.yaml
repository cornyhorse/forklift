{{- /*
Secrets the chart generates when no existing Secret is named. They are hooks (made before the
bootstrap Job, which needs them on the first install) and keep their values across upgrades
(lookup). `helm uninstall` leaves them, on purpose: FORKLIFT_SECRETS_KEYS decrypts every stored
connection secret. Nothing here is ever printed, logged or put into an annotation.
*/ -}}
{{- $fullname := include "forklift.fullname" . -}}
{{- $hook := dict "hooks" "pre-install,pre-upgrade" "weight" -20 -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "forklift.secretsSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and .Release.IsUpgrade (not $existing) }}
{{- fail (printf "The Secret %s, made when this release was installed, is missing or cannot be read. It holds FORKLIFT_SECRETS_KEYS, which decrypts every stored connection secret, so the chart does not make new keys on an upgrade: restore the Secret (or name one with secrets.existingSecret). helm template and client-side --dry-run cannot read Secrets; use --dry-run=server." $name) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "forklift.labels" (dict "root" . "component" "gateway") | nindent 4 }}
  annotations:
    {{- include "forklift.hookAnnotations" $hook | nindent 4 }}
type: Opaque
data:
  # Django's signing key, and one Fernet key (32 random bytes, URL-safe base64) for the
  # connection secrets; rotate_secrets adds keys later.
  {{ .Values.secrets.secretKeyKey }}: {{ include "forklift.keptSecretValue" (dict "root" . "secret" $name "key" .Values.secrets.secretKeyKey "new" (randAlphaNum 64)) }}
  {{ .Values.secrets.secretsKeysKey }}: {{ include "forklift.keptSecretValue" (dict "root" . "secret" $name "key" .Values.secrets.secretsKeysKey "new" (randBytes 32 | replace "+" "-" | replace "/" "_")) }}
{{- end }}
{{- if not .Values.admin.existingSecret }}
{{- $name := include "forklift.adminSecretName" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "forklift.labels" (dict "root" . "component" "bootstrap") | nindent 4 }}
  annotations:
    {{- include "forklift.hookAnnotations" $hook | nindent 4 }}
type: Opaque
data:
  # The first admin's password, used only when the bootstrap Job creates that account
  {{ .Values.admin.passwordKey }}: {{ include "forklift.keptSecretValue" (dict "root" . "secret" $name "key" .Values.admin.passwordKey "new" (randAlphaNum 24)) }}
{{- end }}
{{- if not .Values.workerToken.existingSecret }}
{{- $name := include "forklift.workerTokenSecretName" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "forklift.labels" (dict "root" . "component" "worker") | nindent 4 }}
  annotations:
    {{- include "forklift.hookAnnotations" $hook | nindent 4 }}
type: Opaque
data:
  # A worker token in the format create_worker_token generates (fkw_ and 43 URL-safe
  # characters, 256 random bits); the bootstrap Job registers it
  {{ .Values.workerToken.key }}: {{ include "forklift.keptSecretValue" (dict "root" . "secret" $name "key" .Values.workerToken.key "new" (printf "fkw_%s" (randAlphaNum 43))) }}
{{- end }}
{{- if and .Values.rustfs.enabled (not .Values.rustfs.existingSecret) (not .Values.objectStore.existingSecret) }}
{{- $name := printf "%s-rustfs" $fullname }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "forklift.labels" (dict "root" . "component" "rustfs") | nindent 4 }}
  annotations:
    {{- include "forklift.hookAnnotations" $hook | nindent 4 }}
type: Opaque
data:
  # The bundled RustFS's root credentials, which the gateway signs with
  {{ .Values.objectStore.accessKeyIdKey }}: {{ include "forklift.keptSecretValue" (dict "root" . "secret" $name "key" .Values.objectStore.accessKeyIdKey "new" (randAlphaNum 20)) }}
  {{ .Values.objectStore.secretAccessKeyKey }}: {{ include "forklift.keptSecretValue" (dict "root" . "secret" $name "key" .Values.objectStore.secretAccessKeyKey "new" (randAlphaNum 40)) }}
{{- end }}

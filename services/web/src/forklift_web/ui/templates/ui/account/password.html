{% extends "ui/base.html" %}
{% block title %}Change your password{% endblock %}
{% block content %}
  <h1>Change your password</h1>
  <form method="post" class="stack">
    {% csrf_token %}
    {% include "ui/_form_errors.html" %}
    {% for field in form %}{% include "ui/_field.html" %}{% endfor %}
    <div class="actions"><button type="submit">Change the password</button></div>
  </form>
{% endblock %}

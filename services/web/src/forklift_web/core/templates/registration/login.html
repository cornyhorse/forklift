<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Forklift</title>
</head>
<body>
  <main>
    <h1>Sign in to Forklift</h1>
    {% if form.errors %}
      <p role="alert">Your username and password did not match. Please try again.</p>
    {% endif %}
    <form method="post" action="{% url 'forklift-login' %}">
      {% csrf_token %}
      <p>{{ form.username.label_tag }} {{ form.username }}</p>
      <p>{{ form.password.label_tag }} {{ form.password }}</p>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>

# Canonical test workflow: the full test suite on every supported Python version, with coverage.
# Formatting/lint checks (and the auto-format of feature branches) live in fast-test.yml.
name: Test Suite

on:
  push:
    branches: [ main, develop, "feature/*", "feat/*", "bugfix/*", "hotfix/*" ]
  pull_request:
    branches: [ main, develop ]

# Least privilege: the tests never need to write to the repository.
permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system libraries (unixODBC runtime for pyodbc)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends unixodbc

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-py${{ matrix.python-version }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all,dev]"

    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --cov=src/forklift/ --cov-report=xml --cov-report=term-missing --cov-report=html -v

    - name: Upload coverage report
      if: always() && matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: Check coverage threshold
      if: matrix.python-version == '3.12'
      run: |
        COVERAGE=$(python -m coverage report --format=total)
        echo "Current coverage: ${COVERAGE}%"
        if [ "${COVERAGE}" -lt 95 ]; then
          echo "::warning::Coverage (${COVERAGE}%) is below 95% threshold"
        else
          echo "::notice::Excellent coverage: ${COVERAGE}%"
        fi

  # The declared lower bound of pyarrow must keep working (numpy<2 and pandas<2.3 are what that
  # pyarrow release was built against).
  minimum-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system libraries (unixODBC runtime for pyodbc)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends unixodbc

    - name: Install dependencies at their minimum supported versions
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all,dev]" "pyarrow==16.1.0" "numpy<2" "pandas<2.3"

    - name: Run unit tests
      run: python -m pytest tests/unit-tests -v

  # The core install (no extras) must import: pandas, polars, openpyxl, pyodbc ... are optional,
  # so nothing outside the declared runtime dependencies may be imported at import time.
  core-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install the package without extras
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Import the package from outside the source tree
      working-directory: ${{ runner.temp }}
      run: |
        python -c "import forklift; print(f'Forklift version: {forklift.__version__}')"
        python -c "from forklift import generate_schema_from_csv, import_csv, read_csv"

  # Real-S3 integration tests are disabled until the repository secrets/permissions are set up.
  # They must only run for the repository itself (never fork pull requests, which get no
  # secrets): `if: github.repository == 'cornyhorse/forklift' &&
  # (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)`

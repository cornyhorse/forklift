# TEST ONLY: a throw-away PostgreSQL for the k3s smoke test (deploy/helm/tests/k3s_smoke.sh).
# No persistence, a password from a Secret the script creates. The chart never runs PostgreSQL:
# production installs point postgres.host at a managed or operated server.
apiVersion: v1
kind: Namespace
metadata:
  name: forklift-test-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: forklift-test-db
  labels: {app: postgres}
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: docker.io/library/postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - {name: POSTGRES_DB, value: forklift}
            - {name: POSTGRES_USER, value: forklift}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -U, forklift, -d, forklift]}
            periodSeconds: 2
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: forklift-test-db
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}

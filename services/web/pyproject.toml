[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forklift-web"
version = "0.1.0"
description = "Forklift gateway: accounts, roles, schema registry, datasets, job queue and presigned storage for the forklift engine's workers"
license = {text = "MIT"}
authors = [{name = "Matt", email = "matt@mattkingsbury.com"}]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# The gateway never imports the engine (forklift-etl) or pyarrow; tests/test_trust_boundary.py
# enforces it. boto3 is used to sign URLs and for metadata calls (HEAD, multipart bookkeeping,
# server-side copy, delete), never to read object contents.
dependencies = [
    "Django>=5.2,<5.3",
    "django-ninja>=1.7,<2",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.34",
    "jsonschema>=4.21",
    "cryptography>=42",
    "gunicorn>=22",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-cov>=5",
]

[project.scripts]
forklift-web = "forklift_web.manage:main"

[project.urls]
Homepage = "https://github.com/cornyhorse/forklift"
Documentation = "https://github.com/cornyhorse/forklift/blob/main/docs/design/platform.md"

[tool.hatch.build.targets.wheel]
packages = ["src/forklift_web"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/Dockerfile"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_settings"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "matrix: the role and scope matrix over every public endpoint",
]

[tool.coverage.run]
source = ["forklift_web"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = [
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99
known_first_party = ["forklift_web"]

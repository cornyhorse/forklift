[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forklift-worker"
version = "0.1.0"
description = "Forklift worker: leases jobs from the forklift gateway and runs the engine in a sandboxed child process"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Matt", email = "matt@mattkingsbury.com"}]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# The supervisor itself uses the standard library only. forklift-etl (the engine, from the root of
# this repository) is what it starts in the child process: `python -I -m forklift run-job`.
dependencies = ["forklift-etl"]

[project.optional-dependencies]
excel = ["forklift-etl[excel]"]
sql = ["forklift-etl[sql]"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "jsonschema>=4.0.0",
    "boto3>=1.20.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=6.0.0",
]

[project.scripts]
forklift-worker = "forklift_worker.cli:main"

[project.urls]
Repository = "https://github.com/cornyhorse/forklift"
Documentation = "https://github.com/cornyhorse/forklift/blob/main/services/worker/README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/forklift_worker"]

[tool.black]
line-length = 99
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "services: needs the services in tests/integration-tests/services (FORKLIFT_TEST_SERVICES=1)",
]

[tool.coverage.run]
source = ["forklift_worker"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

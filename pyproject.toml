[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forklift"
version = "0.1.0"
description = "A data processing tool"
authors = [
    {name = "Matthew Kingsbury", email = "your.email@example.com"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = [
    "pyarrow>=12.0.0",
    "jsonschema",
    "click",
    "pandas",  # for some compatibility features
    "boto3>=1.26.0",  # for S3 streaming support
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
forklift = "forklift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forklift"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

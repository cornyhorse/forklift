# Fast checks: formatting and lint. The full test suite lives in test.yml.
#
#   * Pull requests (including ones from forks) and pushes to the default branch only CHECK
#     formatting (black --check / isort --check) and lint; the token is read-only.
#   * Pushes to other branches of this repository are auto-formatted and the result is committed
#     back to that branch. Only that job gets `contents: write`; pull_request events never do.
#     (Commits made with GITHUB_TOKEN do not trigger further workflow runs.)
name: Format and Lint

on:
  push:
    branches: [ main, develop, "feature/*", "feat/*", "bugfix/*", "hotfix/*", 'v*' ]
  pull_request:
    branches: [ main, develop ]

# Least privilege by default; the autoformat job below opts in to write access for itself only.
permissions:
  contents: read

concurrency:
  group: format-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    # Read-only: never modifies the repository.
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-

    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        pip install "black>=23.12" "isort>=5.13" "flake8>=6.0"

    - name: Check formatting with Black
      run: black --check --diff --line-length 99 src/ tests/ services/ deploy/

    - name: Check import order with isort
      run: isort --check-only --diff --profile black --line-length 99 src/ tests/ services/ deploy/

    - name: Lint with flake8 (src only, excluding tests)
      run: flake8 src/ --max-line-length=99 --extend-ignore=E203,W503

  autoformat:
    # Pushes to non-default branches of this repository only (a push event always runs in the
    # repository that received the push, so this never runs for fork pull requests).
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-

    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        pip install "black>=23.12" "isort>=5.13"

    - name: Auto-format code with Black
      run: black --line-length 99 src/ tests/ services/ deploy/

    - name: Auto-sort imports with isort
      run: isort --profile black --line-length 99 src/ tests/ services/ deploy/

    - name: Commit formatting changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: '🤖 Auto-format code with Black and isort'
        file_pattern: 'src/ tests/ services/ deploy/'
        commit_user_name: 'github-actions[bot]'
        commit_user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'

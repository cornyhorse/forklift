# The forklift platform on one machine: gateway, worker, PostgreSQL and RustFS.
#
#   python deploy/compose/generate_env.py > deploy/compose/.env     # once: random secrets
#   docker compose -f deploy/compose/docker-compose.yml up -d --build --wait
#   open http://localhost:8080 and sign in as "admin" (password: FORKLIFT_ADMIN_PASSWORD in .env)
#
# See README.md next to this file. Networks keep the trust boundary of docs/design/platform.md:
#   public    the gateway's public port (UI, /api/v1) and RustFS, both published to the host
#             (browsers upload and download through presigned URLs, straight to the store)
#   internal  gateway, worker, RustFS; no route outside it. The worker reaches only the gateway's
#             internal port (8081, never published) and the store
#   db        PostgreSQL and the gateway processes; the worker is not on it
#
# Profiles (COMPOSE_PROFILES in .env, or --profile):
#   caddy         TLS in front of the gateway and the store (caddy/Caddyfile; generate_env.py
#                 --domain writes the settings it needs)
#   egress-proxy  an allow-listing proxy for workers whose store is outside the stack
#                 (egress-proxy/squid.conf); external-store.yml uses it
name: forklift

x-gateway: &gateway
  image: ${FORKLIFT_WEB_IMAGE:-forklift-web:local}
  build:
    context: ../..
    dockerfile: services/web/Dockerfile
    args:
      PYTHON_IMAGE: ${FORKLIFT_PYTHON_IMAGE:-python:3.13-slim}
  environment:
    FORKLIFT_SECRET_KEY: ${FORKLIFT_SECRET_KEY:?set it in .env (generate_env.py)}
    FORKLIFT_SECRETS_KEYS: ${FORKLIFT_SECRETS_KEYS:?set it in .env (generate_env.py)}
    FORKLIFT_DB_HOST: postgres
    FORKLIFT_DB_NAME: forklift
    FORKLIFT_DB_USER: forklift
    FORKLIFT_DB_PASSWORD: ${FORKLIFT_DB_PASSWORD:?set it in .env (generate_env.py)}
    # The gateway's own calls (HEAD, multipart bookkeeping, copies, deletes) and the URLs it signs
    # for workers go to RustFS on the internal network (or to an external store,
    # external-store.yml); browser URLs to the published port (or Caddy's store domain).
    FORKLIFT_S3_ENDPOINT_URL: ${FORKLIFT_STORE_URL:-http://rustfs:9000}
    FORKLIFT_S3_WORKER_ENDPOINT_URL: ${FORKLIFT_STORE_URL:-http://rustfs:9000}
    FORKLIFT_S3_PUBLIC_ENDPOINT_URL: ${FORKLIFT_PUBLIC_STORE_URL:-http://localhost:9000}
    FORKLIFT_S3_BUCKET: ${FORKLIFT_STORE_BUCKET:-forklift}
    FORKLIFT_S3_REGION: ${FORKLIFT_STORE_REGION:-us-east-1}
    FORKLIFT_S3_ACCESS_KEY_ID: ${FORKLIFT_STORE_ACCESS_KEY:?set it in .env (generate_env.py)}
    FORKLIFT_S3_SECRET_ACCESS_KEY: ${FORKLIFT_STORE_SECRET_KEY:?set it in .env (generate_env.py)}
    FORKLIFT_ALLOWED_HOSTS: ${FORKLIFT_ALLOWED_HOSTS:-localhost,127.0.0.1,gateway}
    FORKLIFT_CSRF_TRUSTED_ORIGINS: ${FORKLIFT_PUBLIC_URL:-http://localhost:8080}
    # Webhook payloads link to the API under the public URL; receivers on an internal network
    # (private addresses) must be listed, and http:// receivers allowed, explicitly
    FORKLIFT_PUBLIC_URL: ${FORKLIFT_PUBLIC_URL:-http://localhost:8080}
    FORKLIFT_WEBHOOK_ALLOWED_HOSTS: ${FORKLIFT_WEBHOOK_ALLOWED_HOSTS:-}
    FORKLIFT_WEBHOOK_ALLOW_HTTP: ${FORKLIFT_WEBHOOK_ALLOW_HTTP:-false}
    # Plain HTTP on localhost; put a TLS proxy in front (the caddy profile, and set these to true)
    # anywhere else
    FORKLIFT_SECURE_COOKIES: ${FORKLIFT_SECURE_COOKIES:-false}
    FORKLIFT_BEHIND_TLS_PROXY: ${FORKLIFT_BEHIND_TLS_PROXY:-false}
    # Proxies whose X-Forwarded-For is trusted for the client address (audit log, sign-in limits)
    FORKLIFT_TRUSTED_PROXIES: ${FORKLIFT_TRUSTED_PROXIES:-0}
    FORKLIFT_LOG_LEVEL: ${FORKLIFT_LOG_LEVEL:-INFO}
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:
  postgres:
    image: ${FORKLIFT_POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: forklift
      POSTGRES_USER: forklift
      POSTGRES_PASSWORD: ${FORKLIFT_DB_PASSWORD:?set it in .env (generate_env.py)}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [db]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "forklift", "-d", "forklift"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  rustfs:
    image: ${FORKLIFT_RUSTFS_IMAGE:-rustfs/rustfs:1.0.1}
    environment:
      RUSTFS_ACCESS_KEY: ${FORKLIFT_STORE_ACCESS_KEY:?set it in .env (generate_env.py)}
      RUSTFS_SECRET_KEY: ${FORKLIFT_STORE_SECRET_KEY:?set it in .env (generate_env.py)}
    volumes: [store:/data]
    # On every host address by default; FORKLIFT_BIND_ADDRESS=127.0.0.1 behind Caddy
    ports: ["${FORKLIFT_BIND_ADDRESS:+${FORKLIFT_BIND_ADDRESS}:}${FORKLIFT_STORE_HOST_PORT:-9000}:9000"]
    networks: [public, internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot setup, safe to repeat: database migrations, the first admin, the bucket and its
  # CORS rule (browsers PUT uploads straight to the store), and the workers' token. It runs as
  # root only to hand the token file to the worker's uid; the gateway itself never does.
  init:
    <<: *gateway
    user: "0:0"
    read_only: false
    restart: "no"
    environment:
      FORKLIFT_SECRET_KEY: ${FORKLIFT_SECRET_KEY}
      FORKLIFT_SECRETS_KEYS: ${FORKLIFT_SECRETS_KEYS}
      FORKLIFT_DB_HOST: postgres
      FORKLIFT_DB_NAME: forklift
      FORKLIFT_DB_USER: forklift
      FORKLIFT_DB_PASSWORD: ${FORKLIFT_DB_PASSWORD}
      FORKLIFT_S3_ENDPOINT_URL: ${FORKLIFT_STORE_URL:-http://rustfs:9000}
      FORKLIFT_S3_BUCKET: ${FORKLIFT_STORE_BUCKET:-forklift}
      FORKLIFT_S3_REGION: ${FORKLIFT_STORE_REGION:-us-east-1}
      FORKLIFT_S3_ACCESS_KEY_ID: ${FORKLIFT_STORE_ACCESS_KEY}
      FORKLIFT_S3_SECRET_ACCESS_KEY: ${FORKLIFT_STORE_SECRET_KEY}
      FORKLIFT_ADMIN_USERNAME: ${FORKLIFT_ADMIN_USERNAME:-admin}
      FORKLIFT_ADMIN_PASSWORD: ${FORKLIFT_ADMIN_PASSWORD:?set it in .env (generate_env.py)}
      FORKLIFT_CORS_ORIGINS: ${FORKLIFT_PUBLIC_URL:-http://localhost:8080}
      FORKLIFT_WORKER_UID: "10001"
    command: ["sh", "/init/init.sh"]
    volumes:
      - ./init:/init:ro
      - worker-token:/tokens
    networks: [internal, db]
    depends_on:
      postgres: {condition: service_healthy}
      rustfs: {condition: service_healthy}

  gateway:
    <<: *gateway
    # 8081 (workers) is not published. On every host address by default;
    # FORKLIFT_BIND_ADDRESS=127.0.0.1 behind Caddy
    ports: ["${FORKLIFT_BIND_ADDRESS:+${FORKLIFT_BIND_ADDRESS}:}${FORKLIFT_PUBLIC_HOST_PORT:-8080}:8080"]
    networks: [public, internal, db]
    depends_on:
      init: {condition: service_completed_successfully}

  # Deletes what retention policies say has expired, every hour (audited). Healthy while its
  # last sweep finished less than two hours ago (it touches the heartbeat file after each one)
  sweeper:
    <<: *gateway
    command:
      - forklift-web
      - sweep_retention
      - --every=3600
      - --heartbeat=/tmp/sweeper.alive
    networks: [internal, db]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/sweeper.alive') > 7200)"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s
    depends_on:
      init: {condition: service_completed_successfully}

  # Every 10 seconds: enqueues the runs of schedules that are due and sends webhook deliveries
  # (public: webhooks need a route out). Healthy while a pass in which every step succeeded
  # finished less than a minute ago (it touches the heartbeat file after each one)
  dispatcher:
    <<: *gateway
    command:
      - forklift-web
      - dispatch
      - --every=10
      - --heartbeat=/tmp/dispatcher.alive
    networks: [public, internal, db]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/dispatcher.alive') > 60)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    depends_on:
      init: {condition: service_completed_successfully}

  # Copies successful runs to their datasets' s3 destinations (data first, manifest.json last)
  # and only then marks them succeeded; one that stops mid-copy leaves its lease to expire and
  # the next pass resumes the run. Its own service: a long copy holds up neither the gateway
  # nor the dispatcher. Healthy while its heartbeat is under a minute old (touched after each
  # pass and every few seconds while a copy runs)
  publisher:
    <<: *gateway
    command:
      - forklift-web
      - publish
      - --every=5
      - --heartbeat=/tmp/publisher.alive
    networks: [public, internal, db]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/publisher.alive') > 60)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    depends_on:
      init: {condition: service_completed_successfully}

  worker:
    image: ${FORKLIFT_WORKER_IMAGE:-forklift-worker:local}
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    command:
      - --gateway=http://gateway:8081
      - --lanes=${FORKLIFT_WORKER_LANES:-batch,interactive}
      - --concurrency=${FORKLIFT_WORKER_CONCURRENCY:-2}
      - --store-host=${FORKLIFT_STORE_HOST:-rustfs:9000}
      - --landlock=${FORKLIFT_WORKER_LANDLOCK:-auto}
    environment:
      FORKLIFT_WORKER_LOG_LEVEL: ${FORKLIFT_WORKER_LOG_LEVEL:-info}
      # Store requests (and streamed inputs) through the egress-proxy profile's proxy, when set
      FORKLIFT_STORE_PROXY: ${FORKLIFT_STORE_PROXY:-}
    volumes:
      - worker-token:/run/secrets:ro
      - scratch:/scratch
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: ${FORKLIFT_WORKER_MEMORY:-4g}
    networks: [internal]
    restart: unless-stopped
    depends_on:
      init: {condition: service_completed_successfully}
      gateway: {condition: service_healthy}

  # Profile "caddy": TLS for the UI and API on FORKLIFT_DOMAIN and for the store on
  # FORKLIFT_STORE_DOMAIN (browsers PUT and GET presigned URLs there), with certificates from
  # ACME or Caddy's own CA (FORKLIFT_TLS); see caddy/Caddyfile. Its certificates and CA are in
  # the caddy-data volume. The gateway behind it needs the settings generate_env.py --domain
  # writes (https public URLs, FORKLIFT_BEHIND_TLS_PROXY, FORKLIFT_TRUSTED_PROXIES=1, and
  # FORKLIFT_BIND_ADDRESS=127.0.0.1 so that only Caddy is reachable from other hosts).
  caddy:
    image: ${FORKLIFT_CADDY_IMAGE:-caddy:2.11.7}
    profiles: [caddy]
    environment:
      FORKLIFT_DOMAIN: ${FORKLIFT_DOMAIN:-}
      FORKLIFT_STORE_DOMAIN: ${FORKLIFT_STORE_DOMAIN:-}
      FORKLIFT_TLS: ${FORKLIFT_TLS:-acme}
      FORKLIFT_ACME_EMAIL: ${FORKLIFT_ACME_EMAIL:-}
      FORKLIFT_HSTS_SECONDS: ${FORKLIFT_HSTS_SECONDS:-31536000}
    command: [sh, /etc/caddy/start.sh]    # checks the settings, then runs Caddy
    ports:
      - "${FORKLIFT_HTTPS_HOST_PORT:-443}:443"
      - "${FORKLIFT_HTTPS_HOST_PORT:-443}:443/udp"    # HTTP/3
      - "${FORKLIFT_HTTP_HOST_PORT:-80}:80"            # redirects to https; ACME challenges
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/start.sh:/etc/caddy/start.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    networks: [public]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # Caddy's admin API (localhost inside the container only) answers once its config is loaded
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped
    depends_on:
      gateway: {condition: service_healthy}

  # Profile "egress-proxy": Squid allowing only the store's URL(s) (FORKLIFT_EGRESS_PROXY_ALLOW,
  # by default FORKLIFT_STORE_URL; see egress-proxy/squid.conf and start.sh), for workers whose
  # store is outside the stack: they stay on internal and set FORKLIFT_STORE_PROXY to
  # http://egress-proxy:3128 (external-store.yml does both). Not published to the host.
  egress-proxy:
    image: ${FORKLIFT_SQUID_IMAGE:-ubuntu/squid:6.6-24.04_edge}
    profiles: [egress-proxy]
    user: "13:13"    # the image's proxy user
    entrypoint: [bash, /etc/squid/forklift/start.sh]
    command: []
    environment:
      FORKLIFT_EGRESS_PROXY_ALLOW: ${FORKLIFT_EGRESS_PROXY_ALLOW:-${FORKLIFT_STORE_URL:-}}
    volumes:
      - ./egress-proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./egress-proxy/start.sh:/etc/squid/forklift/start.sh:ro
    tmpfs:
      - /run/forklift-egress:uid=13,gid=13,mode=0700
      - /var/spool/squid:uid=13,gid=13,mode=0700
      - /var/log/squid:uid=13,gid=13,mode=0700
    networks: [internal, public]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # Squid answers a request (with 403: nothing but the store is allowed); not logged
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/3128 && printf 'GET http://127.0.0.1/ HTTP/1.0\r\n\r\n' >&3
          && read -r -t 4 status <&3 && [[ $$status == HTTP/* ]]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

networks:
  public: {}
  internal: {internal: true}
  db: {internal: true}

volumes:
  pgdata: {}
  store: {}
  worker-token: {}
  scratch: {}
  caddy-data: {}
  caddy-config: {}

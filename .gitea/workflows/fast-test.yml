# Gitea Actions port of .github/workflows/fast-test.yml: the read-only `format-check` job.
# Not ported: the `autoformat` job. It commits formatted code back to feature branches with a write token (and a third-party action), so it
# stays on GitHub; a Gitea pull request only checks.
# pip's cache is kept through setup-python's `cache: pip` instead of a separate actions/cache step.
# No secrets are used, so it is safe on pull_request (including forks).
name: Format and Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: format-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    # Read-only: never modifies the repository.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements*.txt

    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        pip install "black>=23.12" "isort>=5.13" "flake8>=6.0"

    - name: Check formatting with Black
      run: black --check --diff --line-length 99 src/ tests/ services/ deploy/

    # One call per tree: each service sorts with its own settings (its own first-party package)
    - name: Check import order with isort
      run: |
        isort --check-only --diff --profile black --line-length 99 src/ tests/ deploy/
        isort --check-only --diff --profile black --line-length 99 services/web
        isort --check-only --diff --profile black --line-length 99 services/worker

    - name: Lint with flake8 (src only, excluding tests)
      run: flake8 src/ --max-line-length=99 --extend-ignore=E203,W503

# An allow-listing HTTP proxy for forklift workers whose object store is outside their network:
# the "egress-proxy" Compose profile (deploy/compose/README.md). The Helm chart's
# networkPolicies.storeEgress.mode: proxy runs the same configuration.
#
# Workers send every object-store request here (FORKLIFT_STORE_PROXY=http://egress-proxy:3128):
# a CONNECT tunnel for an https:// store (TLS stays end to end; the proxy sees the host name
# only), plain requests for an http:// one. Only the destinations in
# /run/forklift-egress/allow.conf are allowed; start.sh writes that file from
# FORKLIFT_EGRESS_PROXY_ALLOW (by default the store's URL). Everything else gets 403.
#
# Nothing is cached, and the log has no query strings: presigned URLs carry their signatures
# there.

http_port 3128

acl CONNECT method CONNECT
acl plain_http proto HTTP

# The allowed destinations: per store URL, an acl for its host, one for its port and an
# http_access rule (CONNECT for https://, plain HTTP requests for http://)
include /run/forklift-egress/allow.conf

http_access deny all

# Never cache object data (and keep no memory cache either)
cache deny all
cache_mem 0 MB

# No limit on request or response bodies: inputs and multipart parts can be many GiB
request_body_max_size 0
reply_body_max_size none

# Do not tell the store the workers' addresses (it sees the proxy's), nor Squid's version
forwarded_for delete
httpd_suppress_version_string on

# One line per request on stdout, without query strings; the User-Agent tells the supervisor
# (forklift-worker/...) from the engine (Python-urllib/...). The container's health check
# (from 127.0.0.1) is not logged.
acl health_check src 127.0.0.1/32
strip_query_terms on
logformat forklift %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %<a "%{User-Agent}>h"
access_log stdio:/dev/stdout forklift !health_check
cache_log stdio:/dev/stderr
logfile_rotate 0

# The container runs as the proxy user, without capabilities, on a read-only root file system
pid_filename none
coredump_dir none
pinger_enable off
shutdown_lifetime 3 seconds
